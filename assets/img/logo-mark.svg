<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Generative Crafting Icon">
  <defs>
    <linearGradient id="gcMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a3d"/>
      <stop offset="100%" stop-color="#00d9c0"/>
    </linearGradient>
  </defs>

  <!-- hexagon frame -->
  <polygon points="32,3 58,17.5 58,46.5 32,61 6,46.5 6,17.5" fill="none" stroke="url(#gcMarkGrad)" stroke-width="2.2"/>

  <!-- wireframe cube -->
  <g fill="none" stroke="#e8edf4" stroke-width="1.6" stroke-linecap="round">
    <path d="M32,18 L18,26 M32,18 L46,26"/>
    <path d="M18,26 L32,34 M46,26 L32,34"/>
    <path d="M18,26 L18,42 M46,26 L46,42"/>
    <path d="M32,34 L32,50"/>
    <path d="M18,42 L32,50 M46,42 L32,50"/>
  </g>

  <!-- molecule bonds extending outward -->
  <g stroke="#00d9c0" stroke-width="1.3" stroke-linecap="round">
    <path d="M32,18 L32,9"/>
    <path d="M18,26 L9,22"/>
    <path d="M46,42 L54,48"/>
  </g>

  <!-- cube vertices -->
  <g fill="#e8edf4">
    <circle cx="32" cy="18" r="1.6"/>
    <circle cx="18" cy="26" r="1.6"/>
    <circle cx="46" cy="26" r="1.6"/>
    <circle cx="32" cy="34" r="1.6"/>
    <circle cx="18" cy="42" r="1.6"/>
    <circle cx="46" cy="42" r="1.6"/>
    <circle cx="32" cy="50" r="1.6"/>
  </g>

  <!-- molecule nodes -->
  <g fill="#00d9c0">
    <circle cx="32" cy="9" r="2.6"/>
    <circle cx="9" cy="22" r="2.6"/>
    <circle cx="54" cy="48" r="2.6"/>
  </g>
</svg>
